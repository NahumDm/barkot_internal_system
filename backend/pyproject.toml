# Barkot backend — tool configuration only.
#
# This is NOT a build system or a dependency manifest. Runtime and
# development dependencies are declared in requirements/ (spec §26.2).

[tool.ruff]
# linting + formatting
target-version = "py314"
preview = true
line-length = 100
src = ["."]
exclude = [
  ".venv",
  "**/migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["apps", "tests"]
addopts = "-ra"