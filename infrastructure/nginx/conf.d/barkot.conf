# Barkot — reverse proxy site (spec §8.3, §18.2).
#
# Topology: Nginx on the host terminates TLS and proxies to the API and web
# containers, which publish only on 127.0.0.1. PostgreSQL is never public.
#
# Domain and certificate paths are the production defaults (spec §19);
# adjust server_name before first production deployment.

upstream barkot_web {
    server 127.0.0.1:3000;
}

upstream barkot_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name barkotbar.com www.barkotbar.com;

    # ACME challenges must terminate on :80 before the HTTPS redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name barkotbar.com www.barkotbar.com;

    ssl_certificate     /etc/letsencrypt/live/barkotbar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barkotbar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (spec §20.2).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://barkot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /health/ {
        proxy_pass http://barkot_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://barkot_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}