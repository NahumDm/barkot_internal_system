name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django · Python 3.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barkot
          POSTGRES_USER: barkot
          POSTGRES_PASSWORD: barkot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barkot -d barkot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_ALLOWED_HOSTS: testserver
      DJANGO_DB_NAME: barkot
      DJANGO_DB_USER: barkot
      DJANGO_DB_PASSWORD: barkot
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/dev.txt

      - name: Lint (ruff check) — §22.2
        run: ruff check .

      - name: Format (ruff format --check) — §22.2
        run: ruff format --check .

      - name: Type check (mypy) — §22.2
        run: mypy .

      - name: Tests (pytest) — §22.2
        run: pytest

      - name: Migrations drift (makemigrations --check) — §22.2
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI gate (drf-spectacular) — §22.2
        run: |
          python manage.py spectacular --file /tmp/schema.yml --validate
          test -s /tmp/schema.yml
          # A non-empty file is not a non-empty API: a schema with no paths still
          # generates a client that calls nothing, so assert that the document
          # describes at least one endpoint (roadmap A2 gate).
          python -c "import sys, yaml; doc = yaml.safe_load(open('/tmp/schema.yml')); paths = doc.get('paths') or {}; sys.exit('OpenAPI schema documents no endpoints.') if not paths else print('OpenAPI documents %d path(s): %s' % (len(paths), ', '.join(sorted(paths))))"

  frontend:
    name: Frontend (Next.js · Node 24)
    runs-on: ubuntu-latest
    services:
      # Only the live Playwright project talks to it, and only to `barket_e2e`.
      # The stubbed project installs its own routes and never opens a socket to
      # this. The name is the contract: `seed_e2e --reset` refuses to flush any
      # database whose name does not end in `_e2e`.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barkot_e2e
          POSTGRES_USER: barkot
          POSTGRES_PASSWORD: barkot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U barkot -d barkot_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_NAME: barkot_e2e
      E2E_DB_USER: barkot
      E2E_DB_PASSWORD: barkot
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: "5433"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The live specs start a real Django, so this job needs one. `dev.txt`
      # rather than `runtime.txt` on purpose: the point of these specs is to
      # check the frontend against the same Django, DRF and psycopg versions the
      # backend suite and the deployed service run, and one requirements file is
      # the cheapest way to guarantee that instead of maintaining two lists meant
      # to agree.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies (for the live E2E server)
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements/dev.txt

      - name: Lint (eslint) — §22.2
        run: npm run lint

      - name: Format (prettier --check) — §22.2
        run: npm run format:check

      - name: Type check (tsc --noEmit) — §22.2
        run: npm run typecheck

      - name: Unit tests (vitest) — §22.2
        run: npm test

      - name: Production build — §22.2
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Both projects. `npm run test:e2e` runs them as two separate Playwright
      # invocations, and that is deliberate rather than incidental: `page.route`
      # intercepts the browser only, so an (app) page's server-side render still
      # asks the real origin for /auth/me/, and four workers doing that against a
      # live Django at once pushed redirect assertions past their timeout. Split
      # them and each result is separately attributable.
      #
      # `stubbed` proves the frontend behaves correctly against network stubs,
      # including states no real server will produce on demand: a dead backend, a
      # forced password change, a 502. `live` proves it against the thing itself
      # — Django on :8010, Postgres, a real session, a real CSRF token, a real
      # 403 when a Cashier tries to void. The second is the one that catches a
      # frontend and backend that have quietly stopped agreeing, which is the
      # failure the stubbed project structurally cannot see (roadmap B5).
      - name: "End-to-end, stubbed + live Django (Playwright) — §22.2 / B5"
        run: npm run test:e2e
