# Barkot — local development stack (spec §18.2).
#
# One command starts the whole environment: Postgres, Django and Next.js, with
# source bind-mounted and hot reload. The disposable `barkot_e2e` database the
# Playwright suite runs against is created here too:
#   docker compose up -d            # db + api + web
#
# When all that is wanted is a database to point host-mode servers at (the
# root README's other workflow), scale back instead of any manual setup:
#   docker compose up -d db

name: barkot-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-barkot}
      POSTGRES_USER: ${DJANGO_DB_USER:-barkot}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-barkot}
    ports:
      # Localhost only, so host tooling (psql, runserver) can reach it.
      # Never expose the database to the public Internet (spec §20.1).
      # Host port 5433: several dev machines run their own PostgreSQL on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # First-boot scripts. The entrypoint runs them once, when a fresh
      # `db_data` volume is initialised, creating `barkot_e2e` alongside the
      # development database - see 01-create-e2e-db.sql.
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-barkot} -d ${DJANGO_DB_NAME:-barkot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    environment: &api-env
      # `api` is the compose-internal hostname: Next's rewrite forwards the
      # request to http://api:8000 and Django validates that Host header too.
      # Overridable so a public tunnel origin can be trusted without editing
      # this file - see .env.example, DJANGO_CSRF_TRUSTED_ORIGINS.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,api,testserver}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-barkot}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-barkot}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-barkot}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      BUSINESS_CURRENCY: ${BUSINESS_CURRENCY:-ETB}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Addis_Ababa}
    volumes:
      # The source bind mount is also what persists uploaded employee documents
      # (`MEDIA_ROOT=/app/media` → `backend/media/`, gitignored): in development
      # a named volume would hide them from the host, which is the opposite of
      # what someone inspecting an upload wants. Production, where there is no
      # bind mount, gets a named volume instead (docker-compose.prod.yml).
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      target: dev
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Barkot}
      # `next dev` proxies /api/v1/ to Django (frontend/next.config.ts); on the
      # compose network Django answers as `api`, not as localhost.
      API_PROXY_TARGET: http://api:8000
      # Comma-separated hostnames allowed to load dev assets, so a public tunnel
      # can hydrate the app. Set to the tunnel host, e.g. *.trycloudflare.com.
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    volumes:
      - ./frontend:/app
      # Container-owned node_modules so Windows host node_modules never leaks in.
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  web_node_modules: