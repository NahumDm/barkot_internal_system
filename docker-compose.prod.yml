# Barkot — production stack (spec §18.2).
#
# Nginx runs on the host, terminates TLS, and proxies to the API and web
# containers which publish ONLY on 127.0.0.1. PostgreSQL and any future
# Redis/Valkey stay on the private Docker network and are never public.
#
# Run with: docker compose --env-file .env -f docker-compose.prod.yml up -d

name: barkot-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME}
      POSTGRES_USER: ${DJANGO_DB_USER}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER} -d ${DJANGO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: prod
    restart: unless-stopped
    environment:
      # `:?` makes compose refuse to start with an explanatory message instead of
      # building an image that crash-loops on Django's own secret-key guard.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required; see .env.example}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME}
      DJANGO_DB_USER: ${DJANGO_DB_USER}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      # Nginx terminates the connection and sets X-Forwarded-For, so the backend
      # must trust it to see the real client address for login rate limiting
      # (spec 9.3, A5). Leaving this false would give every client the proxy's
      # address as its throttle key, so one bad password locks out everyone.
      DJANGO_TRUSTED_PROXY: ${DJANGO_TRUSTED_PROXY:-true}
      BUSINESS_CURRENCY: ${BUSINESS_CURRENCY:-ETB}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Addis_Ababa}
    volumes:
      # Uploaded employee documents live under MEDIA_ROOT (`/app/media`) and are
      # served by no web server: Nginx proxies only `/api/v1/`, and Django has no
      # route that returns a stored file. Without a volume they would sit in the
      # container's writable layer and be destroyed by the next `up --build`,
      # which is exactly the data the register promises to keep.
      - media:/app/media
    ports:
      # Reachable by host Nginx only (spec §20.1).
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      target: runner
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Barkot}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  # Employee documents (`MEDIA_ROOT=/app/media`, spec §5). A named volume, not
  # the container's writable layer: `docker compose up --build` replaces the
  # container, and the register's whole point is that a stored contract survives
  # that. Only the backend mounts it; nothing serves it over HTTP.
  media: