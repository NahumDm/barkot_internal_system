# Barkot backend — tool configuration only.
#
# This is NOT a build system or a dependency manifest. Runtime and
# development dependencies are declared in requirements/ (spec §26.2).

[tool.ruff]
# linting + formatting
target-version = "py314"
preview = true
line-length = 100
src = ["."]
exclude = [
  ".venv",
  "**/migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
  # Django declares Meta options (ordering, permissions, default_permissions,
  # constraints) as plain class attributes by design; annotating them ClassVar
  # would fight the framework for no benefit.
  "RUF012",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
# `apps` is a real package under this directory. Without these two settings
# mypy resolves apps/<app>/models.py as both "accounts.models" (walking up from
# apps/) and "apps.accounts.models" (from the project root) and aborts.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["apps", "tests"]
addopts = "-ra"