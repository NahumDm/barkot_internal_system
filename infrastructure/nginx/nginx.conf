# Barkot — main Nginx configuration (spec §8.3, §20.1).
#
# Nginx runs on the host (spec §18.2) and terminates TLS. It routes
# /api/v1/ to Django/Gunicorn and everything else to the Next.js server.
# Site configuration lives in conf.d/.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$request_id"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Request size limit (spec §20.1).
    client_max_body_size 10m;

    # Rate limits (spec §9.3, §20.1).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}